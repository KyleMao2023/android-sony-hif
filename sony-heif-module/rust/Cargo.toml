[package]
name = "sony_hif_codec"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
heic-rs = { path = "vendor/heic-rs", default-features = false, features = ["std", "parallel"] }

[dev-dependencies]
heic-rs = { path = "vendor/heic-rs", default-features = false, features = ["bench"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 8
panic = "unwind"

[[bin]]
name = "codec-check"
path = "src/check.rs"
